name: Scan

on:
  workflow_dispatch:
  workflow_call:

jobs:
  scan:
    name: Test and SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Run tests
        run: |
          pipx install uv==0.13.5
          uv sync --frozen
          uv run task test

      - name: Check openapi.json is up to date
        run: uv run task openapi-check

      # Dependabot-triggered runs cannot read Actions secrets (only Dependabot
      # secrets), so SONAR_TOKEN is empty and the scan would fail.
      - name: SonarCloud Scan
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # 8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
