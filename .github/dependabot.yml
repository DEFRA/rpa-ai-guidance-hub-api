version: 2

updates:
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 10

    cooldown:
      default-days: 7

    groups:
      uv:
        patterns:
          - '*'

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      - dependency-type: direct

  - package-ecosystem: github-actions
    directory: /

    cooldown:
      default-days: 7

    groups:
      github-actions:
        patterns:
          - '*'

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

  - package-ecosystem: docker
    directory: /

    groups:
      docker:
        patterns:
          - '*'

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

  - package-ecosystem: docker-compose
    directory: /

    cooldown:
      default-days: 7

    groups:
      docker-compose:
        patterns:
          - '*'

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
