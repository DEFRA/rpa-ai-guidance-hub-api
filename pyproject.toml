[project]
name = "rpa-ai-guidance-hub-api"
version = "0.1.0"
description = "rpa-ai-guidance-hub-api"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.5.0",
    "boto3==1.43.123",
    "dnspython==2.9.1",
    "ecs-logging==2.3.0",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "lxml==6.1.3",
    "multidict==7.2.1",
    "opentelemetry-api==1.45.2",
    "pydantic-ai-slim[bedrock]==2.65.0",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "pymongo[aws,encryption,snappy,zstd]==4.19.0",
    "python-docx==1.2.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "werkzeug==3.1.9",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "filelock==4.2.7",
    "moto[s3]==5.2.5",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "taskipy==1.14.1",
    "testcontainers==4.15.0",
    "types-aiofiles==25.1.0.20260518",
    "vcrpy==9.4.2",
    "virtualenv==21.15.2",
]

[project.scripts]
rpa-ai-guidance-hub-api = "app.entrypoints.fastapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
branch = true
include = ["app/*"]
omit = ["tests/*"]

[tool.coverage.html]
directory = "coverage/coverage_html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
lint = "uv run ruff format ./app ./tests --check && uv run ruff check ./app ./tests && uv run python -m scripts.check_raises ./tests"
typecheck = "uv run mypy ./app ./tests"
openapi = "uv run python -m scripts.export_openapi"
openapi-check = "uv run python -m scripts.export_openapi --check"
test = "uv run task lint && uv run task typecheck && uv run coverage run -m pytest -vv && uv run coverage html && uv run coverage xml"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped Mongo testcontainer fixture needs the same event loop across
# all tests, since AsyncMongoClient binds to the loop it was created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pymongo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aws_embedded_metrics.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.uv]
exclude-newer = "1 week"
# Exempt from the cooldown so the trust bundle can pick up eMudhra G3 intermediate
# revocations (https://blog.talosintelligence.com/compromised-intermediate-certificates/).
# Exempt boto3/botocore so we can take botocore 1.43.117, whose vendored CA bundle
# drops the Comodo AAA root that cross-signed the compromised eMudhra G3 root.
exclude-newer-package = { certifi = false, boto3 = false, botocore = false }
default-groups = ["dev"]
