sonar.projectKey=DEFRA_rpa-ai-guidance-hub-api
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/rpa-ai-guidance-hub-api
sonar.links.ci=https://github.com/DEFRA/rpa-ai-guidance-hub-api/actions
sonar.links.scm=https://github.com/DEFRA/rpa-ai-guidance-hub-api
sonar.links.issue=https://github.com/DEFRA/rpa-ai-guidance-hub-api/issues

sonar.sources=app/
sonar.exclusions=tests/**/test_*.py
sonar.tests=tests/
sonar.test.inclusions=tests/**/test_*.py

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage/coverage.xml

# SonarCloud cannot substitute the TypeVar in dataclasses.replace(), so it reads
# _link_marks as returning DataclassInstance and reports the _Marks hint as wrong.
# mypy resolves it correctly (reveal_type gives _Marks, and warn_return_any is on),
# so this is a false positive rather than a waiver. resourceKey is as narrow as the
# syntax allows - a real S5886 in this file would be hidden too, so keep the scope
# under review if the rule ever fires here for a good reason.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.e1.resourceKey=app/guidance/parsing/inline.py
