services:
  floci:
    image: floci/floci@sha256:a0fbf944d7f338cc0856f1ef83831ea749ff2be71956eb7a7fce08fc21458e19 # 1.5.19-compat
    ports:
      - '4566:4566'
    env_file:
      - '.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis@sha256:3ce533b2b057f74b235d1d8697ae08b1b6ff0a5e16827ea6a377b6365693c7ed # 7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo@sha256:b0c835c26e5997413e985000f1013c275377cd9607761c1784d486f6dd620b7f # 7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The API gives each saved version to search to index, so search runs here too, from
  # its published image. Its settings are given one by one, not from ./.env, which
  # holds the API's (its database among them).
  rpa-ai-guidance-hub-search:
    image: defradigital/rpa-ai-guidance-hub-search@sha256:f9e578abced058172affc1b8e0566304da0ca31a6ad9490192c1b166c92679e1 # 0.17.0
    ports:
      - 8086:8086
    depends_on:
      floci:
        condition: service_healthy
      # Not service_started: search pings Mongo as it starts, and exits if it cannot.
      mongodb:
        condition: service_healthy
    environment:
      # Not development, which the image sets: that runs uvicorn reloading for changes.
      PYTHON_ENV: production
      PORT: 8086
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      FLOCI_ENDPOINT_URL: http://floci:4566
      # Search starts without Bedrock, but its config requires the setting.
      CLAUDE_SONNET_MODEL_CONFIG: anthropic.claude-sonnet-4-6,arn:aws:bedrock:eu-west-2:123456789012:application-inference-profile/fake-profile-local
    networks:
      - cdp-tenant

  rpa-ai-guidance-hub-api:
    build:
      context: .
      target: development
    ports:
      - 8085:8085
    links:
      - "floci:floci"
      - "mongodb:mongodb"
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
      # Each save is given to search, so that it is indexed.
      rpa-ai-guidance-hub-search:
        condition: service_started
    env_file:
      - ".env"
    environment:
      PORT: ${PORT:-8085}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
      # Not ${FLOCI_ENDPOINT_URL:-...}: compose interpolates that from ./.env,
      # which holds the host-side value and would win over the default.
      FLOCI_ENDPOINT_URL: http://floci:4566
      # Not ${CONVERSIONS_SQS_QUEUE_URL:-...}, for the same reason.
      CONVERSIONS_SQS_QUEUE_URL: http://floci:4566/000000000000/rpa_ai_guidance_hub_conversions
      # Not ${SEARCH_API_BASE_URL:-...}, for the same reason.
      SEARCH_API_BASE_URL: http://rpa-ai-guidance-hub-search:8086
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      HOST: ${HOST:-0.0.0.0}
      # Same bucket name whether run on host or in the container - only the
      # endpoint differs, and that's AWS_ENDPOINT_URL/FLOCI_ENDPOINT_URL above.
      SOURCE_DOCS_S3_BUCKET: ${SOURCE_DOCS_S3_BUCKET:-rpa-ai-guidance-hub-source-docs}
    develop:
      watch:
        - action: sync
          path: ./app
          target: /home/nonroot/app
          ignore:
            - README.md
            - "**/*.md"
            - "**/test_*.py"
            - tests/**/*
            - .git/**/*
            - .venv/**/*
            - .pytest_cache/**/*
            - .ruff_cache/**/*
            - .vscode/**/*
            - .github/**/*
            - requirements-dev.txt
            - pytest.ini
            - .pre-commit-config.yaml
            - sonar-project.properties
            - LICENCE
        - action: rebuild
          path: ./pyproject.toml
          target: /home/nonroot/pyproject.toml
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
